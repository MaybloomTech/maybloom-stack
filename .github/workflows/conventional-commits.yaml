name: Conventional commits

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  # The action lists the PR's commits through the API; without this the
  # token gets "Resource not accessible by integration".
  pull-requests: read

jobs:
  commitlint:
    name: Validate commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # commitlint needs the full history of the PR range to lint
          # every commit, not just the merge ref.
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.mjs

  # The repo squash-merges with the PR title as the commit subject, so the
  # title is what actually lands on main — lint it with the same commitlint
  # config the commits job uses.
  pr-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint PR title with commitlint
        env:
          # Untrusted input: always through an env var, never interpolated
          # into the script.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          npm install --no-save --no-audit --no-fund \
            @commitlint/cli@19 @commitlint/config-conventional@19
          printf '%s\n' "$PR_TITLE" | npx commitlint
