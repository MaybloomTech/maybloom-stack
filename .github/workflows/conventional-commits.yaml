name: Conventional commits

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  # The repo squash-merges with the PR title as the commit subject, so the
  # title is the only commit that lands on main, and the only one linted.
  # The branch's own commits are not checked: a slip in one of them would
  # otherwise need a history rewrite during review to clear.
  pr-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint PR title with commitlint
        env:
          # Untrusted input: always through an env var, never interpolated
          # into the script.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          npm install --no-save --no-audit --no-fund \
            @commitlint/cli@19 @commitlint/config-conventional@19
          printf '%s\n' "$PR_TITLE" | npx commitlint
