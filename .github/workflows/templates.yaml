name: Templates

# The bootstrap ships GitHub Actions workflows as templates, and a template
# is never run in this repository. This scaffolds both backends and lints
# what a new project would receive: the workflows after substitution, with
# actionlint (which runs shellcheck over every `run:` script). A pin to an
# input an action no longer has, or a script error, fails here rather than
# on somebody's first pull request.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - skills/maybloom-stack-bootstrap/**
      - .github/workflows/templates.yaml

permissions:
  contents: read

jobs:
  workflows:
    name: Lint the scaffolded workflows
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [go, typescript]
        # one scaffold of each visibility: go is private (the default)
        include:
          - backend: typescript
            visibility: public
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Scaffold
        env:
          BACKEND: ${{ matrix.backend }}
          VISIBILITY: ${{ matrix.visibility || 'private' }}
        run: |
          python3 skills/maybloom-stack-bootstrap/scripts/scaffold.py \
            --name Orchard --slug orchard --org @orchard-tech \
            --out "$RUNNER_TEMP/orchard" --backend "$BACKEND" --visibility "$VISIBILITY"
          if grep -rn '__[A-Z][A-Z_]*__' "$RUNNER_TEMP/orchard/.github"; then
            echo "::error::a placeholder survived substitution in the workflows"
            exit 1
          fi
          if grep -n '__[A-Z][A-Z_]*__' "$RUNNER_TEMP/orchard/AGENTS.md"; then
            echo "::error::a placeholder survived substitution in AGENTS.md"
            exit 1
          fi
      - name: Agent setup
        env:
          VISIBILITY: ${{ matrix.visibility || 'private' }}
        run: |
          cd "$RUNNER_TEMP/orchard"
          jq empty .claude/settings.json
          jq -r '.hooks[][].hooks[].command' .claude/settings.json | while read -r cmd; do
            hook="${cmd//\"\$CLAUDE_PROJECT_DIR\"/$PWD}"
            if [ ! -x "$hook" ]; then
              echo "::error::hook $cmd does not resolve to an executable in the scaffold"
              exit 1
            fi
          done
          grep -qx '@AGENTS.md' CLAUDE.md
          grep -q '^## Delegation' AGENTS.md
          if [ "$VISIBILITY" = private ]; then
            test -f docs/plans/README.md
          else
            test ! -e docs/plans
          fi
          shellcheck .claude/hooks/*.sh
      - name: actionlint
        run: |
          cd "$RUNNER_TEMP/orchard"
          # actionlint looks for the repository root.
          git init -q
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -no-color
