name: Publish image

# The site image is built and pushed here so a deployment can pull a tag
# instead of building from source. Where it gets *run* is still the
# operator's business — this publishes an artifact of the repository to the
# repository's own namespace, and says nothing about anybody's machines.

on:
  push:
    branches: [main]
    # Only the inputs that change the image. A docs edit changes the site,
    # so docs/ belongs here; a skills edit does not.
    paths:
      - docs/**
      - site/**
      - Dockerfile
      - nginx.conf
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/publish-image.yaml
  # The same inputs on a pull request, built but not pushed. Without this the
  # only signal on a change to this file is a green check from three
  # workflows that never touched it, and the first real run happens after
  # merge. GitHub Actions does not support YAML anchors, hence the repetition.
  pull_request:
    paths:
      - docs/**
      - site/**
      - Dockerfile
      - nginx.conf
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/publish-image.yaml
  workflow_dispatch:

# A queued run for an older commit would publish a stale `latest`.
concurrency:
  group: publish-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build the site image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        # Nothing to log in for on a pull request, and a fork's token cannot
        # write packages, so this would be the step that fails.
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The workflow token is enough to push to this repository's own
          # namespace, so there is no registry credential to store.
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          # Lowercased by the action, which matters because the owner is
          # spelled MaybloomTech and registries reject uppercase.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=Maybloom Stack documentation site
            org.opencontainers.image.description=The maybloom stack documents, rendered as a static site.

      - uses: docker/build-push-action@v6
        with:
          context: .
          # A pull request proves the image builds; only main publishes it.
          push: ${{ github.event_name != 'pull_request' }}
          # linux/amd64 only, because that is what the site is deployed to.
          # Adding linux/arm64 here is one word, but do it together with
          # pinning the Dockerfile's build stage to --platform=$BUILDPLATFORM:
          # the runtime stage is COPY-only and needs no emulation, while the
          # node build would otherwise run under QEMU and take minutes.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Public values baked into a public static site, not secrets. Unset
          # repository variables arrive as empty strings, which is the
          # Dockerfile's documented "ship no tracking tag at all" case.
          build-args: |
            PUBLIC_ANALYTICS_SCRIPT_URL=${{ vars.PUBLIC_ANALYTICS_SCRIPT_URL }}
            PUBLIC_ANALYTICS_SITE_ID=${{ vars.PUBLIC_ANALYTICS_SITE_ID }}
