version: 2

updates:
  # Conventional Commits are enforced by CI on both the PR title and every
  # commit message, so the prefix here is not cosmetic: without it every
  # Dependabot pull request fails the title check before anyone looks at it.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      # A solo maintainer reviewing eight separate patch bumps is how
      # updates stop getting reviewed. Minor and patch move together.
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # TypeScript 7 is the native compiler, and it does not expose the
      # programmatic API that `astro check` is built on, so typecheck fails
      # outright on it. This was merged once already. Remove this when
      # withastro/roadmap#1321 ships support; until then a major bump here
      # is a known break rather than an upgrade to evaluate.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
