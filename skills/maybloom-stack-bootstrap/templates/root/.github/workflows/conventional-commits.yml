# Conventional Commits on every pull request's title, against
# commitlint.config.mjs with the commitlint the lockfile pins (through the
# workspace catalog), so a local `pnpm exec commitlint` answers the same.
# Only the title: a squash merge makes it the one commit that lands on
# main, so the branch's own commits are not checked.
name: Conventional commits

on:
  pull_request:
    # `edited` reruns the title check when only the title changed.
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: commits-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job, one check to require.
  commits:
    name: conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No pnpm cache: one root-only install, which under the
          # lockfile's key would shadow CI's full-workspace store.
      # Only the root package, where commitlint is a devDependency.
      # --ignore-scripts skips the root postinstall (codegen and every build).
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter "{.}"
      - name: Lint the title
        env:
          # Untrusted text: through the environment, never interpolated
          # into the script.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --verbose
