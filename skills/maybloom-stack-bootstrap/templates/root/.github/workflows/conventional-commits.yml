# Conventional Commits on every pull request: each commit on the branch and
# the title, against commitlint.config.mjs with the commitlint pinned in the
# root package.json, so a local `pnpm exec commitlint` answers the same.
# The title matters most: a squash merge makes it the commit on main.
name: Conventional commits

on:
  pull_request:
    # `edited` reruns the title check when only the title changed.
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: commits-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job, so one install and one check to require.
  commits:
    name: conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The branch's whole history: commitlint reads every commit in
          # the range, not only the merge.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Only the root package, where commitlint is a devDependency.
      # --ignore-scripts skips the root postinstall (codegen and every build).
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter "{.}"
      - name: Lint the title
        env:
          # Untrusted text: through the environment, never interpolated
          # into the script.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --verbose
      # Runs when the title fails too, so one run reports both.
      - name: Lint the branch's commits
        if: ${{ !cancelled() }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # HEAD is GitHub's test merge: its first parent is main as the
          # merge was built, its second the branch, so the range is exactly
          # the commits the branch adds. The event's base.sha can lag
          # behind main and would drag in commits already merged; it is the
          # fallback only when HEAD is not a merge.
          if git rev-parse --verify -q 'HEAD^2' >/dev/null; then
            from="$(git rev-parse 'HEAD^1')"
          else
            from="$BASE_SHA"
          fi
          pnpm exec commitlint --from "$from" --to "$HEAD_SHA" --verbose
