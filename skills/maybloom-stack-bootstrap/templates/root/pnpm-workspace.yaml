packages:
  - "packages/*"

# These versions are a floor, not a pin: the last set known to build
# together, kept so a scaffold works offline and without a refresh step. They
# go stale on their own, because nothing watches a template. Step 1 of the
# skill's checklist raises them to current before install, and the ceilings
# that must not be raised are recorded there with their reasons.
catalog:
  astro: ^6.3.1
  "@astrojs/check": ^0.9.4
  "@bufbuild/buf": ^1.62.1
  "@bufbuild/protoc-gen-es": ^2.10.2
  "@bufbuild/protobuf": ^2.10.2
  "@biomejs/biome": ^2.3.11
  "@connectrpc/connect": ^2.1.1
  "@connectrpc/connect-fastify": ^2.1.1
  "@connectrpc/connect-node": ^2.1.1
  "@connectrpc/connect-web": ^2.1.1
  "@types/node": ^25.0.3
  jose: ^5.9.2
  react: ^19.1.0
  react-dom: ^19.1.0
  "@types/react": ~19.1.10
  tsup: ^8.5.1
  tsx: ^4.21.0
  typescript: ^5.9.3
