server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Content-hashed build output never changes, so cache it hard.
  location /_astro/ {
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Manually named static files get a short cache.
  location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
  }

  # Plain static site: serve the file, then the directory index, else 404.
  # No SPA fallback, because unknown paths should 404 rather than silently
  # serving the homepage.
  location / {
    try_files $uri $uri/ =404;
  }
}
